<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Prompt Studio | Catálogo</title>


<style>

/* ========================================
   CONFIGURAÇÕES GERAIS
======================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f5f3;
  color: #222;
  min-height: 100vh;
}


/* ========================================
   CABEÇALHO
======================================== */

header {
  text-align: center;
  padding: 40px 20px 25px;
}


header h1 {
  font-size: 32px;
  letter-spacing: 1px;
  margin-bottom: 10px;
}


header p {
  color: #666;
  font-size: 15px;
  line-height: 1.5;
}


/* ========================================
   CATEGORIAS
======================================== */

.categorias {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;

  padding: 10px 20px 30px;
}


.categorias button {
  border: 1px solid #222;
  background: transparent;
  color: #222;

  padding: 11px 18px;

  border-radius: 30px;

  font-size: 14px;
  cursor: pointer;

  transition: 0.2s;
}


.categorias button:hover {
  background: #222;
  color: white;
}


.categorias button.ativo {
  background: #222;
  color: white;
}


/* ========================================
   AVISO
======================================== */

.aviso {
  text-align: center;
  color: #777;
  font-size: 14px;
  padding: 0 20px 25px;
}


/* ========================================
   GALERIA
======================================== */

.galeria {
  width: min(1200px, 94%);
  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px, 1fr)
    );

  gap: 15px;

  padding-bottom: 140px;
}


/* ========================================
   FOTO
======================================== */

.foto {
  position: relative;

  background: #eee;

  border-radius: 12px;

  overflow: hidden;

  cursor: pointer;

  aspect-ratio: 4 / 5;

  border: 3px solid transparent;

  transition: 0.2s;
}


.foto img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


.foto:hover {
  transform: scale(1.01);
}


/* ========================================
   FOTO SELECIONADA
======================================== */

.foto.selecionada {
  border-color: #111;
}


.marcador {
  position: absolute;

  top: 10px;
  right: 10px;

  width: 30px;
  height: 30px;

  background: white;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.2);

  opacity: 0;

  transition: 0.2s;
}


.foto.selecionada .marcador {
  opacity: 1;
}


/* ========================================
   NOME DA FOTO
======================================== */

.nome-foto {
  position: absolute;

  bottom: 0;
  left: 0;
  right: 0;

  padding: 25px 10px 9px;

  color: white;

  font-size: 12px;

  text-align: center;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.65)
    );
}


/* ========================================
   BARRA INFERIOR
======================================== */

.barra {
  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  background: white;

  border-top: 1px solid #ddd;

  padding:
    12px
    20px
    calc(12px + env(safe-area-inset-bottom));

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 15px;

  z-index: 100;
}


.contador {
  font-size: 14px;
  font-weight: bold;
}


.enviar {
  border: none;

  background: #111;
  color: white;

  padding: 13px 22px;

  border-radius: 30px;

  font-size: 14px;

  cursor: pointer;
}


.enviar:disabled {
  background: #bbb;
  cursor: default;
}


/* ========================================
   QUANDO NÃO HÁ FOTOS
======================================== */

.sem-fotos {
  grid-column: 1 / -1;

  text-align: center;

  color: #777;

  padding: 50px 20px;
}


/* ========================================
   CELULAR
======================================== */

@media (max-width: 600px) {

  header {
    padding-top: 28px;
  }


  header h1 {
    font-size: 25px;
  }


  .galeria {
    width: 96%;

    grid-template-columns:
      repeat(2, 1fr);

    gap: 8px;
  }


  .foto {
    border-radius: 8px;
  }


  .categorias {
    gap: 7px;
  }


  .categorias button {
    padding: 9px 13px;
    font-size: 13px;
  }


  .barra {
    justify-content: space-between;
  }

}

</style>

</head>


<body>


<!-- ========================================
     CABEÇALHO
======================================== -->

<header>

  <h1>PROMPT STUDIO</h1>

  <p>
    Escolha suas referências favoritas.<br>
    Toque nas fotos para selecionar.
  </p>

</header>



<!-- ========================================
     BOTÕES DAS CATEGORIAS
======================================== -->

<div class="categorias">

  <button
    class="ativo"
    data-categoria="aniv"
  >
    Aniversário
  </button>


  <button
    data-categoria="vida"
  >
    Vida
  </button>


  <button
    data-categoria="acad"
  >
    Academia
  </button>


  <button
    data-categoria="prof"
  >
    Profissional
  </button>


  <button
    data-categoria="luxo"
  >
    Luxo
  </button>

</div>



<div class="aviso">
  Você pode escolher referências de categorias diferentes.
</div>



<!-- ========================================
     GALERIA
======================================== -->

<div
  id="galeria"
  class="galeria"
></div>



<!-- ========================================
     BARRA INFERIOR
======================================== -->

<div class="barra">

  <div
    id="contador"
    class="contador"
  >
    0 selecionadas
  </div>


  <button
    id="btnEnviar"
    class="enviar"
    onclick="enviar()"
    disabled
  >
    Enviar escolhas
  </button>

</div>



<script>

/* ========================================
   CONFIGURAÇÕES DAS CATEGORIAS
======================================== */

/*
Cada categoria aceita até 50 fotos.

O sistema procura automaticamente:

.jpg
.jpeg
.png
.webp

Portanto:

aniv1.jpg
vida1.jpeg
acad1.png

podem funcionar normalmente.
*/

const categorias = {

  aniv: {
    nome: "Aniversário",
    prefixo: "aniv"
  },

  vida: {
    nome: "Vida",
    prefixo: "vida"
  },

  acad: {
    nome: "Academia",
    prefixo: "acad"
  },

  prof: {
    nome: "Profissional",
    prefixo: "prof"
  },

  luxo: {
    nome: "Luxo",
    prefixo: "luxo"
  }

};



const extensoes = [
  "jpg",
  "jpeg",
  "png",
  "webp"
];


const MAXIMO_FOTOS = 50;



/* ========================================
   VARIÁVEIS
======================================== */

let categoriaAtual = "aniv";


let selecionadas = [];


const cacheFotos = {};



/* ========================================
   VERIFICAR SE UMA FOTO EXISTE
======================================== */

function verificarImagem(src) {

  return new Promise(resolve => {

    const imagem = new Image();


    imagem.onload = function () {

      resolve(src);

    };


    imagem.onerror = function () {

      resolve(null);

    };


    imagem.src =
      src +
      "?v=" +
      Date.now();

  });

}



/* ========================================
   PROCURAR EXTENSÃO CORRETA
======================================== */

async function procurarFoto(prefixo, numero) {

  for (
    const extensao
    of extensoes
  ) {

    const arquivo =
      prefixo +
      numero +
      "." +
      extensao;


    const existe =
      await verificarImagem(
        arquivo
      );


    if (existe) {

      return arquivo;

    }

  }


  return null;

}



/* ========================================
   CARREGAR FOTOS DA CATEGORIA
======================================== */

async function carregarFotosCategoria(categoria) {

  if (cacheFotos[categoria]) {

    return cacheFotos[categoria];

  }


  const configuracao =
    categorias[categoria];


  const fotos = [];


  /*
  Testa de 1 até 50.
  Assim você pode adicionar novas fotos
  sem precisar alterar o código.
  */

  const verificacoes = [];


  for (
    let numero = 1;
    numero <= MAXIMO_FOTOS;
    numero++
  ) {

    verificacoes.push(
      procurarFoto(
        configuracao.prefixo,
        numero
      )
    );

  }


  const resultados =
    await Promise.all(
      verificacoes
    );


  resultados.forEach(
    arquivo => {

      if (arquivo) {

        fotos.push(arquivo);

      }

    }
  );


  cacheFotos[categoria] =
    fotos;


  return fotos;

}



/* ========================================
   MOSTRAR FOTOS
======================================== */

async function mostrarFotos(categoria) {

  categoriaAtual =
    categoria;


  const galeria =
    document.getElementById(
      "galeria"
    );


  galeria.innerHTML =
    '<div class="sem-fotos">Carregando fotos...</div>';


  const fotos =
    await carregarFotosCategoria(
      categoria
    );


  galeria.innerHTML = "";


  if (fotos.length === 0) {

    galeria.innerHTML =
      '<div class="sem-fotos">Nenhuma foto encontrada nesta categoria.</div>';


    return;

  }


  fotos.forEach(
    arquivo => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "foto";


      if (
        selecionadas.includes(
          arquivo
        )
      ) {

        item.classList.add(
          "selecionada"
        );

      }


      const imagem =
        document.createElement(
          "img"
        );


      imagem.src =
        arquivo;


      imagem.alt =
        arquivo;


      imagem.loading =
        "lazy";


      const marcador =
        document.createElement(
          "div"
        );


      marcador.className =
        "marcador";


      marcador.innerHTML =
        "✓";


      const nome =
        document.createElement(
          "div"
        );


      nome.className =
        "nome-foto";


      nome.textContent =
        arquivo.replace(
          /\.(jpg|jpeg|png|webp)$/i,
          ""
        );


      item.appendChild(
        imagem
      );


      item.appendChild(
        marcador
      );


      item.appendChild(
        nome
      );


      item.addEventListener(
        "click",
        function () {

          selecionarFoto(
            arquivo,
            item
          );

        }
      );


      galeria.appendChild(
        item
      );

    }
  );

}



/* ========================================
   SELECIONAR / DESSELECIONAR
======================================== */

function selecionarFoto(
  arquivo,
  elemento
) {

  const indice =
    selecionadas.indexOf(
      arquivo
    );


  if (indice === -1) {

    selecionadas.push(
      arquivo
    );


    elemento.classList.add(
      "selecionada"
    );

  }

  else {

    selecionadas.splice(
      indice,
      1
    );


    elemento.classList.remove(
      "selecionada"
    );

  }


  atualizarContador();

}



/* ========================================
   CONTADOR
======================================== */

function atualizarContador() {

  const contador =
    document.getElementById(
      "contador"
    );


  const botao =
    document.getElementById(
      "btnEnviar"
    );


  const quantidade =
    selecionadas.length;


  contador.textContent =
    quantidade +
    (
      quantidade === 1
        ? " selecionada"
        : " selecionadas"
    );


  botao.disabled =
    quantidade === 0;

}



/* ========================================
   TROCAR CATEGORIA
======================================== */

document
  .querySelectorAll(
    ".categorias button"
  )
  .forEach(
    botao => {

      botao.addEventListener(
        "click",
        function () {

          document
            .querySelectorAll(
              ".categorias button"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "ativo"
                )
            );


          botao.classList.add(
            "ativo"
          );


          const categoria =
            botao.dataset.categoria;


          mostrarFotos(
            categoria
          );

        }
      );

    }
  );



/* ========================================
   ENVIAR ESCOLHAS PELO WHATSAPP
======================================== */

function enviar() {

  if (
    selecionadas.length === 0
  ) {

    return;

  }


  const lista =
    selecionadas
      .slice()
      .sort(
        (a, b) =>
          a.localeCompare(
            b,
            undefined,
            {
              numeric: true
            }
          )
      );


  const mensagem =
    "Olá! Estas são as referências que escolhi:\n\n" +

    lista
      .map(
        foto =>
          "• " +
          foto.replace(
            /\.(jpg|jpeg|png|webp)$/i,
            ""
          )
      )
      .join("\n");


  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    url,
    "_blank"
  );

}



/* ========================================
   INICIAR CATÁLOGO
======================================== */

mostrarFotos(
  categoriaAtual
);


atualizarContador();


</script>


</body>

</html>
