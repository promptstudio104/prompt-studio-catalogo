<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt Studio | Catálogo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f5f3;
    color: #222;
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

header h1 {
    margin: 0 0 10px;
    font-size: 30px;
}

header p {
    margin: 0;
    color: #666;
    line-height: 1.5;
}

.categorias {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 20px;
}

.categorias button {
    border: 1px solid #222;
    background: white;
    color: #222;
    padding: 10px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
}

.categorias button.ativo {
    background: #222;
    color: white;
}

.aviso {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 0 20px 20px;
}

.galeria {
    width: min(1200px, 94%);
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    padding-bottom: 120px;
}

.foto {
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid transparent;
    background: #eee;
}

.foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.foto.selecionada {
    border-color: #111;
}

.check {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    background: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.foto.selecionada .check {
    display: flex;
}

.nome {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 25px 8px 8px;
    text-align: center;
    color: white;
    font-size: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
}

.sem-fotos {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.barra {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top: 1px solid #ddd;
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 100;
}

#contador {
    font-weight: bold;
    font-size: 14px;
}

#enviar {
    border: 0;
    background: #111;
    color: white;
    padding: 13px 20px;
    border-radius: 30px;
    cursor: pointer;
}

#enviar:disabled {
    background: #aaa;
}

@media (max-width: 600px) {
    .galeria {
        width: 96%;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
    }

    header h1 {
        font-size: 25px;
    }

    .categorias {
        padding: 15px 10px 20px;
    }

    .categorias button {
        font-size: 13px;
        padding: 9px 12px;
    }

    .barra {
        justify-content: space-between;
    }
}
</style>
</head>

<body>

<header>
    <h1>PROMPT STUDIO</h1>
    <p>
        Escolha suas referências favoritas.<br>
        Toque nas fotos para selecionar.
    </p>
</header>

<div class="categorias">

    <button class="ativo" data-cat="aniv">
        Aniversário
    </button>

    <button data-cat="vida">
        Vida
    </button>

    <button data-cat="acad">
        Academia
    </button>

    <button data-cat="prof">
        Profissional
    </button>

    <button data-cat="luxo">
        Luxo
    </button>

</div>

<div class="aviso">
    Você pode selecionar fotos de categorias diferentes.
</div>

<div id="galeria" class="galeria"></div>

<div class="barra">

    <div id="contador">
        0 selecionadas
    </div>

    <button id="enviar" disabled>
        Enviar escolhas
    </button>

</div>

<script>

/*
========================================
CONFIGURAÇÃO
========================================

O catálogo procura até 50 fotos
em cada categoria.

Aniversário:
aniv1.jpg até aniv50.jpg

Vida:
vida1.jpeg até vida50.jpeg

Academia:
acad1.jpg até acad50.jpg

Profissional:
prof1.jpg até prof50.jpg

Luxo:
luxo1.jpg até luxo50.jpg
*/

const categorias = {

    aniv: {
        prefixo: "aniv",
        extensao: "jpg"
    },

    vida: {
        prefixo: "vida",
        extensao: "jpeg"
    },

    acad: {
        prefixo: "acad",
        extensao: "jpg"
    },

    prof: {
        prefixo: "prof",
        extensao: "jpg"
    },

    luxo: {
        prefixo: "luxo",
        extensao: "jpg"
    }

};

const MAX_FOTOS = 50;

let categoriaAtual = "aniv";

const selecionadas = new Set();

const galeria = document.getElementById("galeria");

const contador = document.getElementById("contador");

const botaoEnviar = document.getElementById("enviar");


/*
========================================
CRIAR FOTO
========================================
*/

function criarFoto(arquivo) {

    const item = document.createElement("div");

    item.className = "foto";

    item.dataset.arquivo = arquivo;


    const imagem = document.createElement("img");

    imagem.src = arquivo;

    imagem.alt = arquivo;

    imagem.loading = "lazy";


    /*
    Se a imagem não existir no GitHub,
    ela simplesmente não aparece.
    */

    imagem.onerror = function() {

        item.remove();

        verificarGaleriaVazia();

    };


    const check = document.createElement("div");

    check.className = "check";

    check.textContent = "✓";


    const nome = document.createElement("div");

    nome.className = "nome";

    nome.textContent = arquivo.replace(
        /\.(jpg|jpeg|png|webp)$/i,
        ""
    );


    item.appendChild(imagem);

    item.appendChild(check);

    item.appendChild(nome);


    if (selecionadas.has(arquivo)) {

        item.classList.add("selecionada");

    }


    item.addEventListener("click", function() {

        selecionarFoto(arquivo, item);

    });


    return item;

}


/*
========================================
CARREGAR CATEGORIA
========================================
*/

function carregarCategoria(categoria) {

    categoriaAtual = categoria;

    galeria.innerHTML = "";


    const config = categorias[categoria];


    for (let numero = 1; numero <= MAX_FOTOS; numero++) {

        const arquivo =
            config.prefixo +
            numero +
            "." +
            config.extensao;


        const foto = criarFoto(arquivo);


        galeria.appendChild(foto);

    }


    /*
    Aguarda as imagens inexistentes
    serem removidas.
    */

    setTimeout(verificarGaleriaVazia, 1500);

}


/*
========================================
VERIFICAR GALERIA
========================================
*/

function verificarGaleriaVazia() {

    const fotos =
        galeria.querySelectorAll(".foto");


    if (fotos.length === 0) {

        galeria.innerHTML =
            '<div class="sem-fotos">' +
            'Nenhuma foto encontrada nesta categoria.' +
            '</div>';

    }

}


/*
========================================
SELECIONAR FOTO
========================================
*/

function selecionarFoto(arquivo, elemento) {

    if (selecionadas.has(arquivo)) {

        selecionadas.delete(arquivo);

        elemento.classList.remove("selecionada");

    }

    else {

        selecionadas.add(arquivo);

        elemento.classList.add("selecionada");

    }


    atualizarContador();

}


/*
========================================
CONTADOR
========================================
*/

function atualizarContador() {

    const quantidade = selecionadas.size;


    if (quantidade === 1) {

        contador.textContent = "1 selecionada";

    }

    else {

        contador.textContent =
            quantidade + " selecionadas";

    }


    botaoEnviar.disabled =
        quantidade === 0;

}


/*
========================================
BOTÕES DAS CATEGORIAS
========================================
*/

document
    .querySelectorAll(".categorias button")
    .forEach(function(botao) {

        botao.addEventListener("click", function() {

            document
                .querySelectorAll(".categorias button")
                .forEach(function(outroBotao) {

                    outroBotao.classList.remove("ativo");

                });


            botao.classList.add("ativo");


            carregarCategoria(
                botao.dataset.cat
            );

        });

    });


/*
========================================
WHATSAPP
========================================
*/

botaoEnviar.addEventListener("click", function() {

    const lista =
        Array.from(selecionadas)
        .sort(function(a, b) {

            return a.localeCompare(
                b,
                undefined,
                {
                    numeric: true
                }
            );

        });


    const nomes =
        lista.map(function(arquivo) {

            return "• " +
                arquivo.replace(
                    /\.(jpg|jpeg|png|webp)$/i,
                    ""
                );

        });


    const mensagem =
        "Olá! Estas são as referências que escolhi:\n\n" +
        nomes.join("\n");


    const url =
        "https://wa.me/?text=" +
        encodeURIComponent(mensagem);


    window.open(url, "_blank");

});


/*
========================================
INICIAR
========================================
*/

carregarCategoria("aniv");

atualizarContador();

</script>

</body>
</html>
