<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Prompt Studio | Catálogo</title>

<style>

/* =========================
   CONFIGURAÇÕES GERAIS
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f5f3;
  color: #222;
}


/* =========================
   CABEÇALHO
========================= */

header {
  text-align: center;
  padding: 40px 20px 25px;
}

header h1 {
  margin: 0 0 10px;
  font-size: 30px;
  letter-spacing: 1px;
}

header p {
  margin: 0;
  color: #666;
  font-size: 15px;
  line-height: 1.5;
}


/* =========================
   TEXTO DE ORIENTAÇÃO
========================= */

.aviso {
  text-align: center;
  color: #777;
  font-size: 14px;
  padding: 0 20px 30px;
}


/* =========================
   GALERIA
========================= */

.galeria {
  width: min(1200px, 94%);
  margin: 0 auto;

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px, 1fr)
    );

  gap: 14px;

  padding-bottom: 130px;
}


/* =========================
   FOTO
========================= */

.foto {
  position: relative;

  aspect-ratio: 4 / 5;

  border-radius: 12px;

  overflow: hidden;

  cursor: pointer;

  border: 3px solid transparent;

  background: #ece8e5;

  transition: 0.2s;
}

.foto:hover {
  transform: scale(1.01);
}

.foto img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


/* =========================
   FOTO SELECIONADA
========================= */

.foto.selecionada {
  border-color: #111;
}

.check {
  display: none;

  position: absolute;

  top: 9px;
  right: 9px;

  width: 32px;
  height: 32px;

  background: white;

  border-radius: 50%;

  align-items: center;
  justify-content: center;

  font-weight: bold;
  font-size: 17px;

  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.foto.selecionada .check {
  display: flex;
}


/* =========================
   NOME DA REFERÊNCIA
========================= */

.nome {
  position: absolute;

  bottom: 0;
  left: 0;
  right: 0;

  padding: 30px 10px 10px;

  color: white;

  text-align: center;

  font-size: 13px;
  font-weight: bold;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.72)
    );
}


/* =========================
   CARREGANDO
========================= */

.status {
  grid-column: 1 / -1;

  text-align: center;

  color: #777;

  padding: 50px 20px;

  font-size: 15px;
}


/* =========================
   BARRA INFERIOR
========================= */

.barra {
  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  background: white;

  border-top: 1px solid #ddd;

  padding:
    12px
    20px
    calc(12px + env(safe-area-inset-bottom));

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 20px;

  z-index: 100;
}

#contador {
  font-size: 14px;
  font-weight: bold;
}

#enviar {
  border: none;

  background: #111;

  color: white;

  padding: 13px 22px;

  border-radius: 30px;

  font-size: 14px;

  cursor: pointer;
}

#enviar:disabled {
  background: #aaa;
  cursor: default;
}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

  header {
    padding-top: 28px;
  }

  header h1 {
    font-size: 25px;
  }

  .galeria {
    width: 96%;

    grid-template-columns:
      repeat(2, 1fr);

    gap: 8px;
  }

  .foto {
    border-radius: 8px;
  }

  .barra {
    justify-content: space-between;
    gap: 10px;
  }

  #contador {
    font-size: 13px;
  }

  #enviar {
    padding: 12px 16px;
  }

}

</style>

</head>


<body>


<header>

  <h1>PROMPT STUDIO</h1>

  <p>
    Escolha suas referências favoritas.<br>
    Toque nas fotos para selecionar.
  </p>

</header>


<div class="aviso">
  Você pode selecionar quantas referências quiser.
</div>


<div
  id="galeria"
  class="galeria"
>

  <div class="status">
    Carregando referências...
  </div>

</div>


<div class="barra">

  <div id="contador">
    0 selecionadas
  </div>

  <button
    id="enviar"
    disabled
  >
    Enviar escolhas
  </button>

</div>


<script>

/* =========================
   CONFIGURAÇÃO
========================= */

const MAX_FOTOS = 200;

const EXTENSOES = [
  "jpg",
  "jpeg",
  "png",
  "webp"
];

const selecionadas = new Set();

const galeria =
  document.getElementById("galeria");

const contador =
  document.getElementById("contador");

const botaoEnviar =
  document.getElementById("enviar");


/* =========================
   VERIFICAR IMAGEM
========================= */

function verificarImagem(src) {

  return new Promise(function(resolve) {

    const img = new Image();

    img.onload = function() {
      resolve(src);
    };

    img.onerror = function() {
      resolve(null);
    };

    img.src = src;

  });

}


/* =========================
   PROCURAR REFERÊNCIA
========================= */

async function procurarReferencia(numero) {

  for (
    const extensao
    of EXTENSOES
  ) {

    const arquivo =
      "ref" +
      numero +
      "." +
      extensao;

    const resultado =
      await verificarImagem(
        arquivo
      );

    if (resultado) {

      return {
        numero: numero,
        arquivo: resultado
      };

    }

  }

  return null;

}


/* =========================
   CRIAR FOTO
========================= */

function criarFoto(ref) {

  const item =
    document.createElement("div");

  item.className = "foto";

  item.dataset.arquivo =
    ref.arquivo;


  const imagem =
    document.createElement("img");

  imagem.src =
    ref.arquivo;

  imagem.alt =
    "Referência " +
    ref.numero;

  imagem.loading =
    "lazy";


  const check =
    document.createElement("div");

  check.className =
    "check";

  check.textContent =
    "✓";


  const nome =
    document.createElement("div");

  nome.className =
    "nome";

  nome.textContent =
    "REF " +
    ref.numero;


  item.appendChild(
    imagem
  );

  item.appendChild(
    check
  );

  item.appendChild(
    nome
  );


  item.addEventListener(
    "click",
    function() {

      selecionarFoto(
        ref,
        item
      );

    }
  );


  return item;

}


/* =========================
   CARREGAR REFERÊNCIAS
========================= */

async function carregarReferencias() {

  galeria.innerHTML =
    '<div class="status">Carregando referências...</div>';


  const verificacoes = [];


  for (
    let numero = 1;
    numero <= MAX_FOTOS;
    numero++
  ) {

    verificacoes.push(
      procurarReferencia(
        numero
      )
    );

  }


  const resultados =
    await Promise.all(
      verificacoes
    );


  const referencias =
    resultados
      .filter(function(item) {

        return item !== null;

      })
      .sort(function(a, b) {

        return a.numero -
               b.numero;

      });


  galeria.innerHTML =
    "";


  if (
    referencias.length === 0
  ) {

    galeria.innerHTML =
      '<div class="status">' +
      'Nenhuma referência encontrada.' +
      '</div>';

    return;

  }


  referencias.forEach(
    function(ref) {

      const foto =
        criarFoto(ref);

      galeria.appendChild(
        foto
      );

    }
  );

}


/* =========================
   SELECIONAR FOTO
========================= */

function selecionarFoto(
  ref,
  elemento
) {

  if (
    selecionadas.has(
      ref.numero
    )
  ) {

    selecionadas.delete(
      ref.numero
    );

    elemento.classList.remove(
      "selecionada"
    );

  }

  else {

    selecionadas.add(
      ref.numero
    );

    elemento.classList.add(
      "selecionada"
    );

  }


  atualizarContador();

}


/* =========================
   CONTADOR
========================= */

function atualizarContador() {

  const quantidade =
    selecionadas.size;


  if (
    quantidade === 1
  ) {

    contador.textContent =
      "1 selecionada";

  }

  else {

    contador.textContent =
      quantidade +
      " selecionadas";

  }


  botaoEnviar.disabled =
    quantidade === 0;

}


/* =========================
   WHATSAPP
========================= */

botaoEnviar.addEventListener(
  "click",
  function() {

    const lista =
      Array.from(
        selecionadas
      )
      .sort(function(a, b) {

        return a - b;

      });


    const referencias =
      lista.map(
        function(numero) {

          return (
            "• REF " +
            numero
          );

        }
      );


    const mensagem =
      "Olá! Estas são as referências que escolhi:\n\n" +
      referencias.join("\n");


    const url =
      "https://wa.me/?text=" +
      encodeURIComponent(
        mensagem
      );


    window.open(
      url,
      "_blank"
    );

  }
);


/* =========================
   INICIAR CATÁLOGO
========================= */

carregarReferencias();

atualizarContador();

</script>


</body>

</html>
